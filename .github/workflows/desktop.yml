name: Build desktop app

# Runs the tests, then builds the Windows installer and the Mac installers.
# Pushing a version tag (v1.2.0 and so on) also publishes them on a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,ai,mcp]"
      - run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: pwsh
        run: packaging/build_windows.ps1
      - name: Check the build
        shell: pwsh
        run: dist/LogAnalyser/LogAnalyser.exe --smoke-test | Out-String
      - uses: actions/upload-artifact@v4
        with:
          name: LogAnalyser-Windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  mac:
    needs: test
    strategy:
      matrix:
        os: [macos-latest]   # Apple silicon; add an Intel runner here if you still need Intel Macs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: bash packaging/build_mac.sh
      - name: Check the build
        run: dist/LogAnalyser.app/Contents/MacOS/LogAnalyser --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: LogAnalyser-macOS-${{ matrix.os }}
          path: |
            dist/*.pkg
            dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          **Windows 10 or 11:** download `LogAnalyser-…-Windows-Setup.exe` and run it. The setup wizard checks your computer, installs anything missing, and adds LogAnalyser to the Start menu. Prefer no install? Unzip `…-Windows-portable.zip` and run `LogAnalyser.exe`.

          **Mac with Apple silicon (M1 to M4), macOS 11 or later:** download `LogAnalyser-…-macOS-Installer.pkg` and open it, or open the `.dmg` and drag LogAnalyser onto Applications.

          These builds are not code-signed yet. The first time:
          - Windows may show "Windows protected your PC": click **More info**, then **Run anyway**.
          - macOS may say it cannot check the app: open **System Settings > Privacy & Security** and click **Open Anyway**.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "LogAnalyser ${GITHUB_REF_NAME#v}" --notes-file notes.md
