[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loganalyser"
version = "1.2.0"
description = "Read logs, find the likely cause of a failure, match events across files and runs, and write an interactive HTML report. Optional LLM second opinion and desktop app."
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=2.3"]
mcp = ["mcp>=2.3"]
desktop = ["anthropic>=2.3", "pywebview>=5", "keyring>=24", "mcp>=2.3"]
build = ["pyinstaller>=6.10", "pillow>=10"]
test = ["pytest>=8"]

[project.scripts]
loganalyser = "loganalyser.cli:main"
loganalyser-mcp = "loganalyser.mcp_server:main"

[project.gui-scripts]
loganalyser-app = "loganalyser.desktop.app:main"

[tool.setuptools.packages.find]
include = ["loganalyser*"]

[tool.setuptools.package-data]
loganalyser = ["assets/*.html", "desktop/ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
