<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogAnalyser</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230e161f'/%3E%3Crect x='5' y='6.5' width='13' height='2.2' rx='1.1' fill='%23a8b6c4'/%3E%3Crect x='5' y='10.9' width='9' height='2.2' rx='1.1' fill='%23ff6fae'/%3E%3Crect x='5' y='15.3' width='11' height='2.2' rx='1.1' fill='%23a8b6c4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --plane: #0e161f; --surface: #142029; --raised: #1a2834; --line: #243442; --line-strong: #33475a;
  --ink: #e6edf3; --ink-2: #a8b6c4; --muted: #7a8a9a;
  --mark: #ff6fae; --mark-ink: #ff8fc0; --mark-wash: rgba(255, 111, 174, 0.16); --mark-wash-strong: rgba(255, 111, 174, 0.32);
  --critical: #d03b3b; --critical-ink: #f07171; --warning: #fab219; --warning-ink: #f5c04a; --good: #0ca30c; --good-ink: #3cc43c;
  --info-ink: #7fb2e8; --focus: #8fd3ff; --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
:root[data-theme="light"] {
  color-scheme: light;
  --plane: #eef2f5; --surface: #ffffff; --raised: #f5f8fa; --line: #dbe3ea; --line-strong: #c3cfd9;
  --ink: #13202c; --ink-2: #43535f; --muted: #687886;
  --mark: #d6337f; --mark-ink: #b01f66; --mark-wash: rgba(214, 51, 127, 0.12); --mark-wash-strong: rgba(214, 51, 127, 0.24);
  --critical-ink: #b42727; --warning-ink: #8a5d00; --good-ink: #006300; --info-ink: #2a63a8; --focus: #1f6fd1;
  --shadow: 0 18px 44px rgba(19, 32, 44, 0.16);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --plane: #eef2f5; --surface: #ffffff; --raised: #f5f8fa; --line: #dbe3ea; --line-strong: #c3cfd9;
    --ink: #13202c; --ink-2: #43535f; --muted: #687886;
    --mark: #d6337f; --mark-ink: #b01f66; --mark-wash: rgba(214, 51, 127, 0.12); --mark-wash-strong: rgba(214, 51, 127, 0.24);
    --critical-ink: #b42727; --warning-ink: #8a5d00; --good-ink: #006300; --info-ink: #2a63a8; --focus: #1f6fd1;
    --shadow: 0 18px 44px rgba(19, 32, 44, 0.16);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--plane); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }
h1, h2, h3 { margin: 0; letter-spacing: -0.015em; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 220px 1fr; height: 100vh; }
.rail { border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 24px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 650; font-size: 16px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); cursor: pointer; text-align: left; }
.nav button:hover { background: var(--raised); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--raised); color: var(--ink); box-shadow: inset 2px 0 0 var(--mark); }
.nav svg { flex: none; opacity: .8; }
.rail-foot { margin-top: auto; padding: 0 8px; display: flex; flex-direction: column; gap: 12px; font-size: 12.5px; color: var(--muted); }
.ai-pill { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink-2); background: none; cursor: pointer; text-align: left; }
.ai-pill:hover { border-color: var(--line-strong); }
.ai-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.ai-pill.on .dot { background: var(--good); box-shadow: 0 0 0 3px rgba(12, 163, 12, .18); }
.ai-pill.warn .dot { background: var(--warning); }
.ai-pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.theme-btn { display: inline-flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; color: var(--ink-2); width: fit-content; }
.main { position: relative; overflow: hidden; min-width: 0; }
.view { position: absolute; inset: 0; overflow-y: auto; padding: 36px 48px 60px; animation: view-in .35s cubic-bezier(.2, .7, .2, 1) both; }
.view.flush { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
@keyframes view-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.wrap { max-width: 1040px; }
.lede { color: var(--ink-2); max-width: 64ch; margin: 8px 0 0; font-size: 16px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--raised); padding: 8px 14px; border-radius: 9px; cursor: pointer; font-size: 14px; white-space: nowrap; transition: border-color .15s, transform .1s; }
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--mark); border-color: var(--mark); color: #1b0610; font-weight: 650; }
:root[data-theme="light"] .btn.primary { color: #fff; }
.btn.big { padding: 12px 22px; font-size: 15.5px; border-radius: 11px; }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.btn.danger:hover { border-color: var(--critical); color: var(--critical-ink); }
.field { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 9px; padding: 0 12px; min-height: 40px; }
.field:focus-within { border-color: var(--focus); }
.field input, .field select, .field textarea { border: 0; background: none; outline: none; width: 100%; min-width: 0; padding: 9px 0; }
.field textarea { resize: vertical; min-height: 40px; }
select { cursor: pointer; }
label.lbl { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

/* ---------- home ---------- */
.home h1 { font-size: clamp(30px, 3.6vw, 44px); font-weight: 680; font-variation-settings: "wdth" 84; letter-spacing: -0.03em; line-height: 1.05; }
.drop { position: relative; margin-top: 26px; border: 1.5px dashed var(--line-strong); border-radius: 16px; overflow: hidden; background: var(--surface); min-height: 250px; display: grid; place-items: center; transition: border-color .2s, background .2s, transform .2s; }
.drop.over { border-color: var(--mark); background: var(--mark-wash); transform: scale(1.005); }
.river { position: absolute; inset: 0; overflow: hidden; pointer-events: none; mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); opacity: .22; }
.drop-inner::before { content: ""; position: absolute; inset: -30px -80px; z-index: -1; background: radial-gradient(closest-side, var(--surface) 55%, transparent); }
.drop.over .drop-inner::before { background: radial-gradient(closest-side, var(--surface) 40%, transparent); }
.river .col { position: absolute; left: 6%; right: 6%; top: 0; font: 12px/22px var(--mono); color: var(--muted); white-space: nowrap; animation: river 48s linear infinite; }
.river .col div { overflow: hidden; text-overflow: ellipsis; }
.river .col .e { color: var(--critical-ink); }
.river .col .w { color: var(--warning-ink); }
.river .sweep { position: absolute; top: 0; bottom: 0; width: 28%; left: -30%; background: linear-gradient(90deg, transparent, var(--mark-wash), transparent); animation: sweep 7s cubic-bezier(.6, 0, .4, 1) infinite; }
@keyframes river { from { transform: translateY(0); } to { transform: translateY(-50%); } }
@keyframes sweep { 0% { left: -30%; } 60%, 100% { left: 105%; } }
.drop-inner { position: relative; z-index: 0; isolation: isolate; text-align: center; padding: 34px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.drop-inner .glyph { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--raised); border: 1px solid var(--line-strong); box-shadow: var(--shadow); }
.drop-inner b { font-size: 18px; font-weight: 650; }
.drop-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.sources { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.src { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); animation: view-in .3s both; }
.src .p { font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; direction: rtl; text-align: left; }
.src .k { font-size: 12px; color: var(--muted); }
.src button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
.src button:hover { color: var(--critical-ink); background: var(--raised); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 28px; margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
.opt h3 { font-size: 15px; margin-bottom: 4px; }
.opt p { margin: 0 0 10px; color: var(--ink-2); font-size: 13.5px; }
.ai-card { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.ai-card.on { border-color: var(--mark); box-shadow: 0 0 0 4px var(--mark-wash); }
.ai-badge { display: inline-grid; place-items: center; min-width: 30px; height: 24px; padding: 0 7px; border-radius: 6px; font: 700 11.5px var(--sans); background: var(--ink); color: var(--plane); }
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 13px; background: var(--line-strong); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .25s cubic-bezier(.3, 1.4, .5, 1); }
.switch input:checked + span { background: var(--mark); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.go-row { display: flex; align-items: center; gap: 16px; margin-top: 28px; flex-wrap: wrap; }
.err { color: var(--critical-ink); font-size: 14px; }
.upload-note { font-size: 13px; color: var(--ink-2); }

/* ---------- progress ---------- */
.progress { display: grid; place-items: center; min-height: 100%; }
.pcard { width: min(720px, 100%); }
.scanner { position: relative; height: 210px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; margin: 24px 0 26px; }
.scanner .stream { position: absolute; left: 22px; right: 22px; top: 0; font: 12px/24px var(--mono); color: var(--muted); animation: stream 6s linear infinite; }
.scanner .stream div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scanner .stream .e { color: var(--critical-ink); }
.scanner .stream .w { color: var(--warning-ink); }
.scanner .lens { position: absolute; left: 0; right: 0; top: 50%; height: 30px; margin-top: -15px; background: var(--mark-wash); border-top: 1px solid var(--mark); border-bottom: 1px solid var(--mark); box-shadow: 0 0 40px var(--mark-wash-strong); }
.scanner .fade { position: absolute; inset: 0; background: linear-gradient(var(--surface), transparent 30%, transparent 70%, var(--surface)); pointer-events: none; }
.scanner.done .stream { animation-play-state: paused; }
@keyframes stream { from { transform: translateY(0); } to { transform: translateY(-50%); } }
.stages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.stages li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 8px 4px; color: var(--muted); transition: color .3s; }
.stages li .ic { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; }
.stages li.active { color: var(--ink); }
.stages li.active .ic { border-color: var(--mark); border-top-color: transparent; animation: spin .8s linear infinite; }
.stages li.done { color: var(--ink-2); }
.stages li.done .ic { border-color: var(--good); background: var(--good); animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
.stages li.done .ic::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
.stages li.skipped { text-decoration: line-through; opacity: .6; }
.stages li .note { font-size: 12.5px; color: var(--muted); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { transform: scale(.2); } to { transform: scale(1); } }
.counters { display: flex; gap: 32px; margin-top: 18px; flex-wrap: wrap; color: var(--ink-2); font-size: 13.5px; }
.counters b { display: block; font-size: 24px; color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 650; }
.pmsg { margin-top: 18px; color: var(--ink-2); min-height: 22px; }

/* ---------- report ---------- */
.rbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.rbar .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 120px; }
.rbar .warnmsg { width: 100%; font-size: 13px; color: var(--warning-ink); }
iframe.report { flex: 1; width: 100%; border: 0; background: var(--plane); }

/* ---------- history ---------- */
.runs { margin-top: 24px; display: flex; flex-direction: column; }
.run { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 18px; align-items: center; padding: 16px 6px; border-top: 1px solid var(--line); cursor: pointer; animation: view-in .35s both; animation-delay: calc(var(--i, 0) * 40ms); }
.run:hover .rt { color: var(--mark-ink); }
.rt { font-weight: 620; font-size: 16px; }
.rs { font-size: 13px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--ink-2); white-space: nowrap; }
.tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.tag.differ i { background: var(--warning); }
.tag.fail i { background: var(--critical); }
.empty { padding: 60px 20px; text-align: center; color: var(--ink-2); }
.empty h2 { color: var(--ink); margin-bottom: 8px; }

/* ---------- settings ---------- */
.settings { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; margin-top: 26px; }
.plist { display: flex; flex-direction: column; gap: 6px; }
.prov { display: grid; grid-template-columns: 1fr auto; gap: 4px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: none; cursor: pointer; text-align: left; transition: border-color .15s, background .15s; }
.prov:hover { border-color: var(--line-strong); }
.prov[aria-selected="true"] { border-color: var(--mark); background: var(--mark-wash); }
.prov b { font-weight: 600; font-size: 14px; }
.prov small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prov .st { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); }
.prov .st.ready { border-color: var(--good); color: var(--good-ink); }
.prov .st.active { border-color: var(--mark); color: var(--mark-ink); }
.pform { display: flex; flex-direction: column; gap: 18px; }
.pform .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pform h2 { font-size: 20px; }
.test { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 40px; }
.result { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; animation: view-in .3s both; }
.result.ok { color: var(--good-ink); }
.result.bad { color: var(--critical-ink); max-width: 60ch; }
.check { width: 20px; height: 20px; }
.check path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .5s .1s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.section { padding-top: 26px; margin-top: 26px; border-top: 1px solid var(--line); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 10px 0; }
.toggle-row div { max-width: 60ch; }
.toggle-row small { display: block; color: var(--muted); font-size: 12.5px; }
input[type=range] { width: 100%; accent-color: var(--mark); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--plane); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); animation: toast 2.6s ease both; z-index: 60; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin .8s linear infinite; display: inline-block; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .river .col, .river .sweep, .scanner .stream { animation: none !important; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .rail { flex-direction: row; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; overflow-x: auto; }
  .nav { flex-direction: row; } .rail-foot { flex-direction: row; margin: 0 0 0 auto; } .rail-foot .ver { display: none; }
  .view { padding: 22px 16px 40px; }
  .opts, .settings, .pform .row2 { grid-template-columns: 1fr; }
  .ai-card { grid-template-columns: auto 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="App">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="2.4" rx="1.2" fill="currentColor" opacity=".35"/><rect x="2" y="10.8" width="14" height="2.4" rx="1.2" fill="var(--mark)"/><rect x="2" y="17.6" width="17" height="2.4" rx="1.2" fill="currentColor" opacity=".35"/></svg>
      LogAnalyser
    </div>
    <div class="nav">
      <button data-go="home"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>New analysis</button>
      <button data-go="history"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>History</button>
      <button data-go="settings"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="10" cy="17" r="2" stroke="currentColor" stroke-width="2" fill="none"/></svg>Settings</button>
    </div>
    <div class="rail-foot">
      <button class="ai-pill" id="aiPill" type="button" role="switch" aria-checked="false" title="Turn the AI second opinion on or off"><span class="dot"></span><span id="aiPillText">AI off</span></button>
      <button class="theme-btn" id="themeBtn" type="button"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg><span id="themeLabel">Theme</span></button>
      <span class="ver" id="ver"></span>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const $ = (s, e = document) => e.querySelector(s);
const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = new Intl.NumberFormat();
const n = (v) => nf.format(v || 0);
const main = $("#main");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "X-Token": TOKEN, ...(opts.body && !(opts.body instanceof Blob) && typeof opts.body === "string" ? { "Content-Type": "application/json" } : {}), ...(opts.headers || {}) } });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body || {}) });
function toast(msg) { const t = el(`<div class="toast" role="status">${esc(msg)}</div>`); document.body.append(t); setTimeout(() => t.remove(), 2700); }

/* ---------- state ---------- */
let S = null;  // server state
const draft = { sources: [], baseline: [], match: "", ai: false };
let currentRun = null;

async function refresh() {
  S = await api("/api/state");
  $("#ver").textContent = "Version " + S.version;
  draft.ai = S.settings.ai_enabled;
  paintAiPill();
}
function activeProvider() { return S.settings.providers[S.settings.active]; }
function providerProblems(name) {
  const p = S.settings.providers[name], cat = S.settings.catalog[name];
  const issues = [];
  if (cat.needs_key && !p.has_key) issues.push("needs an API key");
  if (!(p.model || cat.model)) issues.push(name === "azure" ? "needs a deployment name" : "needs a model");
  if (["azure", "custom", "ollama"].includes(name) && !(p.base_url || cat.base_url)) issues.push("needs an endpoint");
  return issues;
}
function providerLine(name) {
  const p = S.settings.providers[name], cat = S.settings.catalog[name];
  return `${cat.label}${(p.model || cat.model) ? ", " + (p.model || cat.model) : ""}`;
}
function paintAiPill() {
  const pill = $("#aiPill");
  const issues = providerProblems(S.settings.active);
  pill.classList.toggle("on", draft.ai && !issues.length);
  pill.classList.toggle("warn", draft.ai && !!issues.length);
  pill.setAttribute("aria-checked", String(draft.ai));
  $("#aiPillText").textContent = draft.ai ? (issues.length ? "AI needs setup" : "AI: " + S.settings.catalog[S.settings.active].label.replace(/ \(.*\)/, "")) : "AI off";
}

/* One AI switch, shown in three places: the sidebar pill, the card on the New analysis screen and
   Settings. Each saves the same setting; the open screen repaints its own copy through onAiChanged. */
let onAiChanged = null;
async function setAi(on) {
  try {
    S.settings = await post("/api/settings", { ai_enabled: on });
  } catch (e) { toast(e.message); return; }
  draft.ai = S.settings.ai_enabled;
  paintAiPill();
  if (onAiChanged) onAiChanged();
  const issues = providerProblems(S.settings.active);
  if (!draft.ai) toast("AI second opinion is off");
  else if (issues.length) toast(`AI is on, but ${S.settings.catalog[S.settings.active].label} ${issues.join(", ")}. Finish it in Settings.`);
  else toast(`AI second opinion is on: ${providerLine(S.settings.active)}`);
}
$("#aiPill").addEventListener("click", async () => {
  await setAi(!draft.ai);
  if (draft.ai && providerProblems(S.settings.active).length) go("settings");
});

/* ---------- theme ---------- */
const root = document.documentElement;
function storedTheme() { try { return localStorage.getItem("loganalyser-theme"); } catch { return null; } }
function applyTheme(t) {
  if (t) root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
  const eff = t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  $("#themeLabel").textContent = eff === "dark" ? "Dark" : "Light";
}
applyTheme(storedTheme());
$("#themeBtn").addEventListener("click", () => {
  const cur = root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const next = cur === "dark" ? "light" : "dark";
  try { localStorage.setItem("loganalyser-theme", next); } catch {}
  applyTheme(next);
  const frame = $("iframe.report"); if (frame) frame.contentWindow.location.reload();
});

function walk(entry, prefix, out) {
  return new Promise((resolve) => {
    if (entry.isFile) { entry.file(f => { out.push([f, prefix + f.name]); resolve(); }, () => resolve()); return; }
    if (!entry.isDirectory) { resolve(); return; }
    const reader = entry.createReader(), all = [];
    const read = () => reader.readEntries(async (batch) => {
      if (!batch.length) { for (const child of all) await walk(child, prefix + entry.name + "/", out); resolve(); return; }
      all.push(...batch); read();
    }, () => resolve());
    read();
  });
}
async function uploadFiles(items, note) {
  // Used when the window cannot tell us real paths: copy the files to a private temporary folder.
  const batch = [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16).padStart(2, "0")).join("");
  let folder = "";
  for (let i = 0; i < items.length; i++) {
    const [file, name] = items[i];
    note.textContent = `Copying ${i + 1} of ${items.length}: ${name}`;
    const r = await api(`/api/upload?batch=${batch}&name=${encodeURIComponent(name)}`, { method: "POST", body: file });
    folder = r.folder;
  }
  note.textContent = `${n(items.length)} file${items.length === 1 ? "" : "s"} ready`;
  return folder;
}

views.progress = (job) => {
  const v = el(`<div class="view progress"><div class="pcard">
    <h1 style="font-size:28px">Reading your logs</h1>
    <div class="scanner" id="scanner" aria-hidden="true"><div class="stream">${linesHtml(18)}</div><div class="lens"></div><div class="fade"></div></div>
    <ol class="stages" id="stages"></ol>
    <div class="counters"><span><b id="cFiles">0</b>files read</span><span><b id="cEvents">0</b>events</span><span><b id="cTime">0s</b>elapsed</span></div>
    <div class="pmsg" id="pmsg" aria-live="polite"></div>
    <div class="go-row" style="margin-top:20px"><button class="btn ghost" id="cancel">Cancel</button><span class="err" id="perr" role="alert"></span></div>
  </div></div>`);
  main.append(v);
  let shownEvents = 0;
  const render = (st) => {
    $("#stages", v).innerHTML = st.stages.map(s => {
      const state = st.skipped.includes(s.id) ? "skipped" : st.done.includes(s.id) ? "done" : (s.id === st.stage && !st.finished) ? "active" : "";
      const note = s.id === "read" && st.filesTotal ? `${st.filesDone} of ${st.filesTotal}` : (s.id === "ai" && st.skipped.includes("ai") ? "off" : "");
      return `<li class="${state}"><span class="ic"></span><span>${esc(s.id === st.stage && state === "active" ? st.message : s.label)}</span><span class="note">${esc(note)}</span></li>`;
    }).join("");
    $("#cFiles", v).textContent = n(st.filesDone);
    $("#cTime", v).textContent = st.elapsed < 60 ? Math.round(st.elapsed) + "s" : Math.floor(st.elapsed / 60) + "m " + Math.round(st.elapsed % 60) + "s";
    // Ease the event counter towards the real number.
    const tick = () => { shownEvents += Math.ceil((st.events - shownEvents) / 4); $("#cEvents", v).textContent = n(shownEvents); if (shownEvents < st.events) requestAnimationFrame(tick); };
    reduce ? ($("#cEvents", v).textContent = n(st.events)) : tick();
    $("#pmsg", v).textContent = st.warning || "";
    if (st.finished) {
      clearInterval(pollTimer);
      $("#scanner", v).classList.add("done");
      if (st.error) { $("#perr", v).textContent = st.error; $("#cancel", v).textContent = "Back"; return; }
      setTimeout(() => openRun(st.runId, st.warning), reduce ? 0 : 450);
    }
  };
  $("#cancel", v).addEventListener("click", async () => {
    if ($("#cancel", v).textContent === "Back") { go(job.kind === "ai" ? "history" : "home"); return; }
    try { await post(`/api/jobs/${job.id}/cancel`); } catch {}
  });
  render(job);
  pollTimer = setInterval(async () => { try { render(await api(`/api/jobs/${job.id}`)); } catch (e) { clearInterval(pollTimer); $("#perr", v).textContent = e.message; } }, 350);
};

      const cat = st.catalog[name], issues = providerProblems(name);
      const status = name === st.active ? `<span class="st active">In use</span>` : (!issues.length ? `<span class="st ready">Ready</span>` : "");
      return `<button class="prov" role="option" aria-selected="${name === sel}" data-p="${name}"><b>${esc(cat.label)}</b>${status}<small>${esc(val(name, "model") || cat.model || (issues[0] || ""))}</small></button>`;
    }).join("");
    v.querySelectorAll(".prov").forEach(b => b.addEventListener("click", () => { sel = b.dataset.p; paintList(); paintForm(); }));
  }
  function paintForm() {
    const cat = st.catalog[sel], p = st.providers[sel];
    const keyState = p.key_from_env ? `Using the ${cat.key_env} environment variable` : p.has_key ? "A key is saved in your system keychain" : "No key saved";
    const isAzure = sel === "azure", isClaude = sel === "anthropic";
    $("#pform", v).innerHTML = `
      <div><h2>${esc(cat.label)}</h2><p class="hint" style="font-size:13.5px">${esc(cat.hint)}</p></div>
      ${cat.needs_key || sel === "custom" ? `<div><label class="lbl" for="fKey">API key</label><div class="field"><input id="fKey" type="password" autocomplete="off" placeholder="${p.has_key ? "Saved. Type a new key to replace it" : "Paste your key"}" spellcheck="false"></div>
        <div class="hint">${esc(keyState)}${p.has_key && !p.key_from_env ? ` · <a href="#" id="clearKey" style="color:var(--ink-2)">Remove saved key</a>` : ""}</div></div>` : ""}
      ${isAzure || sel === "custom" || sel === "ollama" || sel === "openai" || sel === "gemini" || sel === "openrouter" || isClaude ? `<div><label class="lbl" for="fUrl">${isAzure ? "Endpoint" : "Base URL"}</label><div class="field"><input id="fUrl" placeholder="${esc(cat.base_url || (isAzure ? "https://my-resource.openai.azure.com" : isClaude ? "Default Anthropic API" : ""))}" spellcheck="false"></div>${isClaude ? `<div class="hint">Leave empty unless you use a proxy or gateway.</div>` : ""}</div>` : ""}
      <div class="row2">
        <div><label class="lbl" for="fModel">${isAzure ? "Deployment name" : "Model"}</label><div class="field"><input id="fModel" list="models" placeholder="${esc(cat.model || (isAzure ? "my-gpt-deployment" : "Load the list, or type a name"))}" spellcheck="false"><datalist id="models"></datalist>
          ${isAzure ? "" : `<button class="btn ghost" id="loadModels" style="padding:4px 8px">Load list</button>`}</div><div class="hint" id="modelHint"></div></div>
        ${isAzure ? `<div><label class="lbl" for="fVer">API version</label><div class="field"><input id="fVer" placeholder="${esc(cat.api_version)}"></div><div class="hint">Use v1 for the newer Foundry endpoint.</div></div>` : ""}
        ${isClaude ? `<div><label class="lbl" for="fEffort">Thinking effort</label><div class="field"><select id="fEffort">${["low", "medium", "high", "xhigh", "max"].map(e => `<option ${val(sel, "effort") === e ? "selected" : ""}>${e}</option>`).join("")}</select></div><div class="hint">Higher is more thorough and slower.</div></div>` : ""}
      </div>
      <div class="test"><button class="btn" id="test">Test connection</button><button class="btn ${sel === st.active ? "ghost" : ""}" id="use" ${sel === st.active ? "disabled" : ""}>${sel === st.active ? "In use" : "Use this provider"}</button><span id="testResult"></span></div>`;
    const bind = (id, key) => { const i = $(id, v); if (!i) return; i.value = val(sel, key) || ""; i.addEventListener("input", () => setEdit(sel, key, i.value)); };
    bind("#fUrl", "base_url"); bind("#fModel", "model"); bind("#fVer", "api_version");
    const key = $("#fKey", v); if (key) key.addEventListener("input", () => setEdit(sel, "api_key", key.value));
    const eff = $("#fEffort", v); if (eff) eff.addEventListener("change", () => setEdit(sel, "effort", eff.value));
    const clear = $("#clearKey", v); if (clear) clear.addEventListener("click", (e) => { e.preventDefault(); setEdit(sel, "clear_key", true); setEdit(sel, "api_key", ""); clear.parentElement.textContent = "The key will be removed when you save."; });
    const lm = $("#loadModels", v);
    if (lm) lm.addEventListener("click", async () => {
      lm.innerHTML = `<span class="spin"></span>`;
      try {
        const r = await post("/api/providers/models", { provider: sel, config: edits[sel] || {} });
        $("#models", v).innerHTML = r.models.map(m => `<option value="${esc(m)}">`).join("");
        $("#modelHint", v).textContent = r.error ? r.error : `${r.models.length} model${r.models.length === 1 ? "" : "s"} found. Click the field to choose.`;
      } catch (e) { $("#modelHint", v).textContent = e.message; }
      lm.textContent = "Load list";
    });
    $("#test", v).addEventListener("click", async () => {
      const out = $("#testResult", v);
      out.innerHTML = `<span class="result"><span class="spin"></span> Testing…</span>`;
      try {
        const r = await post("/api/providers/test", { provider: sel, config: edits[sel] || {} });
        out.innerHTML = r.ok
          ? `<span class="result ok"><svg class="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>Connected to ${esc(r.model || "the model")} in ${r.seconds}s</span>`
          : `<span class="result bad">${esc(r.error)}</span>`;
      } catch (e) { out.innerHTML = `<span class="result bad">${esc(e.message)}</span>`; }
    });
    $("#use", v).addEventListener("click", () => { st.active = sel; paintList(); paintForm(); });
  }
  $("#redact", v).checked = st.privacy.redact;
  $("#maxLines", v).value = st.privacy.max_lines;
  $("#maxLinesVal", v).textContent = n(st.privacy.max_lines);
  $("#maxLines", v).addEventListener("input", (e) => { st.privacy.max_lines = +e.target.value; $("#maxLinesVal", v).textContent = n(st.privacy.max_lines); });
  $("#redact", v).addEventListener("change", (e) => { st.privacy.redact = e.target.checked; });
  $("#aiDefault", v).checked = st.ai_enabled;
  $("#aiDefault", v).addEventListener("change", (e) => setAi(e.target.checked));
  onAiChanged = () => { st.ai_enabled = S.settings.ai_enabled; $("#aiDefault", v).checked = st.ai_enabled; };
  $("#save", v).addEventListener("click", async () => {
    try {
      S.settings = await post("/api/settings", { active: st.active, ai_enabled: st.ai_enabled, privacy: st.privacy, providers: edits });
      for (const k of Object.keys(edits)) delete edits[k];
      draft.ai = S.settings.ai_enabled;
      paintAiPill();
      toast("Settings saved");
      Object.assign(st, JSON.parse(JSON.stringify(S.settings)));
      paintList(); paintForm();
    } catch (e) { $("#serr", v).textContent = e.message; }
  });
  paintList(); paintForm();
};

const startRun = new URLSearchParams(location.hash.slice(1)).get("run");
refresh().then(() => S.history.some(r => r.id === startRun) ? openRun(startRun) : go("home")).catch(e => { main.innerHTML = `<div class="view"><div class="empty"><h2>Could not start</h2><p>${esc(e.message)}</p></div></div>`; });
</script>
</body>
</html>
